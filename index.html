<style>
/* Layout: coluna única pensada para celular. Busca no topo, abas Foto/Vídeo, cartões com capa, prompt recolhido e botão de copiar. */
:root {
  --bg: #eaf1f1;
  --surface: #ffffff;
  --surface-2: #f3f7f7;
  --fg: #0f1f1f;
  --muted: #4d6262;
  --line: #cfdcdc;
  --accent: #b86a00;
  --accent-ink: #ffffff;
  --accent-soft: #fbead0;
  --teal: #0b7f7a;
  --teal-soft: #d4efec;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1415; --surface: #121f21; --surface-2: #0e191b; --fg: #e8f1f0; --muted: #93aaa9;
    --line: #233638; --accent: #f0a93a; --accent-ink: #1a1100; --accent-soft: #2c2210;
    --teal: #4fd1c7; --teal-soft: #12302f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1415; --surface: #121f21; --surface-2: #0e191b; --fg: #e8f1f0; --muted: #93aaa9;
  --line: #233638; --accent: #f0a93a; --accent-ink: #1a1100; --accent-soft: #2c2210;
  --teal: #4fd1c7; --teal-soft: #12302f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 22px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--fg); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }

.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }

.search { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 12px; }
.search label { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.search-row { display: flex; gap: 8px; flex-wrap: wrap; }
.search input { flex: 1 1 200px; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
.search input::placeholder { color: var(--muted); }
.btn-go { flex: 1 1 110px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.85rem; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--teal-soft); color: var(--teal); border: 0; border-radius: 999px; padding: 7px 13px; font-size: 0.88rem; font-weight: 500; cursor: pointer; }

.tabs { display: flex; gap: 8px; }
.tab { flex: 1; background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 8px; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { color: var(--muted); font-size: 0.9rem; margin: -8px 0 0; }

.list { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.cover { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: flex; align-items: flex-end; padding: 12px; color: #fff; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / 0.55), transparent 60%); }
.cover > * { position: relative; z-index: 1; }
.cover.has-img { aspect-ratio: 4 / 5; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; background: rgb(0 0 0 / 0.55); padding: 4px 8px; border-radius: 6px; }
.ratio { margin-left: auto; font-family: var(--font-mono); font-size: 0.72rem; background: rgb(255 255 255 / 0.2); padding: 4px 8px; border-radius: 6px; }
.body { padding: 14px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.15; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 0.78rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.prompt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.6; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.card.open .prompt { display: block; -webkit-line-clamp: unset; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.act { border-radius: 12px; padding: 12px; font-weight: 700; font-size: 0.92rem; cursor: pointer; border: 1.5px solid var(--teal); background: transparent; color: var(--teal); }
.act.primary { background: var(--teal); color: var(--bg); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 18px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 4px; }
.note { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

rio e os mesmos acessórios nas quatro fotografias.\n\nQUATRO COMPOSIÇÕES FOTOGRÁFICAS\n\nFOTO 1 — Retrato editorial de pé\n\nO modelo inclina-se para a frente, apoiando firmemente as duas mãos abertas sobre uma mesa branca, com os braços naturalmente estendidos. A parte superior do corpo fica ligeiramente inclinada para a frente, enquanto vira a cabeça para a esquerda, olhando pensativamente para um ponto fora da câmara.\n\nCapture uma vista de três quartos que destaque o fato bem ajustado, a postura confiante e os acessórios elegantes. Utilize um enquadramento de plano médio a corpo inteiro.\n\nFOTO 2 — Retrato de luxo sentado\n\nO modelo está sentado confortavelmente numa cadeira vintage de madeira escura, recostado com uma postura descontraída e confiante. Uma das mãos fica próxima do queixo, enquanto a outra repousa sobre o colo.\n\nAs pernas ficam naturalmente estendidas para a frente, mostrando as calças de fato com riscas finas, as meias pretas e os sapatos sociais pretos bem polidos.\n\nUtilize um enquadramento de corpo inteiro, com espaço negativo dramático à sua volta.\n\nFOTO 3 — Retrato de plano médio e primeiro plano\n\nO modelo está sentado atrás de uma mesa branca, inclinando-se ligeiramente para a frente. Uma das mãos apoia o rosto na zona da bochecha, enquanto o outro antebraço repousa sobre a mesa.\n\nEle olha diretamente para a câmara com uma expressão calma e confiante."},

enquadramento, tipografia, integração fotográfica, cores, iluminação, texturas, sobreposições, espaçamento e hierarquia visual.\n\nFORMATO: retrato vertical, exatamente 1230 × 1536 px, aproximadamente 4:5.\n\nNÃO redesenhar, modernizar, simplificar, embelezar, reorganizar, reinterpretar ou transformar em um modelo genérico de aniversário criado por IA. Todo o tratamento visual deve transmitir a sensação de um pôster de aniversário profissional de moda/editorial, composto manualmente.\n\nFUNDO\n\nRecriar a cena externa cinematográfica em tons profundos de vermelho-bordô, aproximadamente #25080F, #4A0D1B, #74172B e rosa queimado suave #A85A58, com um céu avermelhado semelhante ao pôr do sol atrás dos personagens.\n\nIncluir uma grande árvore em silhueta ocupando a região superior esquerda e central do fundo, com galhos grossos e escuros estendendo-se horizontal e diagonalmente, além de uma folhagem densa e texturizada em tons avermelhados.\n\nAtrás da árvore, manter a paisagem residencial/arquitetônica distante, incluindo um telhado escuro inclinado, fios elétricos discretos, silhuetas do horizonte e uma névoa atmosférica suave.\n\nNo canto superior esquerdo, incluir um grande elemento escuro curvo/diagonal em primeiro plano, semelhante à borda/interior de um veículo ou abertura arquitetônica, com superfícies em camadas marrom-pretas e pequenos reflexos claros ao longo da borda diagonal.\n\nCriar forte sensação de profundidade utilizando várias camadas escuras semitransparentes, desfoque fotográfico, névoa atmosférica, vinheta sutil e sombras profundas.\n\nAdicionar uma granulação fina de filme e uma textura fotográfica levemente áspera em toda a imagem.\n\nTodo o fundo deve possuir uma correção de cor cinematográfica em vermelho-bordô escuro, e não parecer um fundo de aniversário claro e limpo.\n\nCOMPOSIÇÃO DO PERSONAGEM\n\nUsar a fotografia de referência enviada como única fonte de identidade.\n\nCriar um enorme retrato em close-up da mesma pessoa, ocupando a região superior direita e centro-direita da composição.\n\nO rosto deve ser extremamente grande, sendo naturalmente cortado pelas bordas superior e direita. A testa/cabelo deve ultrapassar a margem superior e o lado direito da cabeça deve aproximar-se da borda direita.\n\nPreservar exatamente a estrutura facial, proporções, olhos, nariz, lábios, maçãs do rosto, mandíbula, assimetria natural, tom de pele, textura da pele e identidade reconhecível.\n\nA expressão deve ser calma, séria e editorial, com os olhos direcionados para o lado esquerdo da composição.\n\nNão embelezar, remodelar, afinar, alargar, envelhecer, rejuvenescer, suavizar ou substituir o rosto por um rosto genérico.\n\nPreservar poros naturais e detalhes fotográficos realistas.\n\nAo lado/abaixo do grande retrato, integrar uma segunda imagem de corpo inteiro ou de três quartos da mesma pessoa, posicionada no lado direito, usando um blazer e calça de alfaiataria em vermelho-coral/rosa-avermelhado profundo, camisa azul-marinho/cinza-escura e uma gravata ornamentada com padrão multicolorido.\n\nA pessoa deve estar sentada ou inclinada em uma pose editorial descontraída, com um antebraço dobrado horizontalmente sobre o torso e a mão repousando naturalmente próxima ao braço oposto.\n\nPreservar anatomia realista, dobras das roupas, textura dos tecidos e proporções corporais.\n\nA figura menor deve ocupar a região inferior direita e estender-se até a borda inferior.\n\nUsar exatamente a mesma pessoa e identidade nas duas escalas fotográficas.\n\nBLOQUEIO DE REFERÊNCIA DO ROSTO\n\nUsar a imagem de referência fornecida como FONTE ABSOLUTA DE IDENTIDADE.\n\nPreservar exatamente a estrutura facial, proporções do rosto, formato e espaçamento dos olhos, formato do nariz, lábios, mandíbula, maçãs do rosto, tom de pele, assimetria natural, linha do cabelo e detalhes faciais realistas.\n\nNunca substituir por um modelo genérico, realizar troca de rosto, embelezamento ou reconstrução facial artificial.\n\nTIPOGRAFIA\n\nReproduzir os números brancos minimalistas da data posicionados aproximadamente na região centro-esquerda/inferior-central:\n\n26\n09\n2009\n\nOs números devem estar empilhados verticalmente, com espaçamento generoso.\n\nUsar um estilo de números geométrico, moderno e fino, em branco aproximadamente #F7F5F2, com traços limpos e sem efeitos decorativos.\n\nOs números devem ser grandes, porém estreitos, alinhados verticalmente e flutuando sobre a paisagem mais escura.\n\nNa extremidade superior direita, reproduzir exatamente a coluna estreita de texto editorial branco conforme aparece na referência, com palavras/fragmentos de letras intencionalmente empilhados verticalmente, parcialmente cortados pela borda e sobrepostos ao grande retrato.\n\nPreservar o espaçamento vertical incomum, o pequeno estilo sans-serif limpo, a cor branca e a disposição editorial fragmentada, em vez de corrigir o texto para um formato convencional de parágrafo.\n\nOs fragmentos visíveis incluem:\n\n“That”\n“young”\n“man!”\n“With”\n“the”\n“strong”\n“aura”\n“and”\n“great”\n“looks”\n\ncom outros caracteres parcialmente ocultos/cortados continuando para baixo ao lado do retrato menor.\n\nNão inventar uma mensagem convencional de aniversário que não esteja visível na referência.\n\nRepetir esse mesmo tratamento de texto editorial vertical ao lado da figura menor, preservando a aparência cortada e fragmentada.\n\nILUMINAÇÃO\n\nCriar uma iluminação fotográfica direcional dramática vindo da região superior/frontal esquerda, produzindo destaques luminosos sobre o rosto grande, mantendo sombras profundas em tons bordô-pretos nas regiões direita e inferior.\n\nOs destaques da pele devem apresentar tons quentes de cobre/rosa, com reflexos controlados na testa, nariz, maçãs do rosto e lábios.\n\nA figura menor deve receber a mesma iluminação direcional quente, com sombras mais profundas nas dobras do traje.\n\nManter alto contraste, saturação moderada e uma gradação cinematográfica em tons bordô.\n\nAdicionar um brilho sutil ao redor dos pontos mais iluminados da pele, mas sem brilho neon artificial.\n\nManter as sombras suaves nas bordas, porém profundas.\n\nTEXTURA\n\nAdicionar:\n\n- Granulação fotográfica realista;\n- Textura de filme sutil;\n- Névoa atmosférica;\n- Vinheta escura;\n- Camadas de transparência;\n- Gradação de cor editorial levemente vintage.\n\nNão incluir: balões, flores, confetes, fitas, glitter, ícones de aniversário ou elementos decorativos genéricos de comemoração.\n\nNão adicionar excesso de brilhos ou elementos decorativos.\n\nO interesse visual deve vir da fotografia, da silhueta da árvore, do fundo arquitetônico, da composição em camadas, da tipografia e da gradação cinematográfica.\n\nCOMPOSIÇÃO\n\nPreservar o equilíbrio assimétrico exato da referência:\n\n- enorme rosto dominando a região superior direita;\n- figura menor de corpo inteiro ancorada na extremidade direita;\n- árvore e arquitetura do pôr do sol preenchendo o fundo esquerdo/central;\n- espaço negativo escuro ocupando a região inferior esquerda;\n- números empilhados “26 / 09 / 2009” flutuando próximo ao centro-esquerdo;\n- texto vertical estreito junto à extremidade direita.\n\nManter exatamente as sobreposições, cortes, relações de escala e espaços negativos da referência.\n\nRENDERIZAÇÃO\n\nCriar uma imagem com qualidade profissional de fotografia editorial em resolução extremamente alta, com detalhes faciais e das roupas extremamente nítidos, poros realistas da pele, anatomia precisa, dobras naturais dos tecidos, composição sofisticada no estilo Photoshop, profundidade cinematográfica, contraste controlado, acabamento profissional de flyer de evento/moda, granulação sutil de filme, integração fotográfica realista e detalhes de qualidade premium para impressão.\n\nA imagem final deve parecer que foi criada por um designer gráfico profissional, manualmente no Photoshop, utilizando fotografias em camadas, máscaras, tipografia, gradação de cores, sombras e sobreposições de textura.\n\nNÃO deve parecer uma imagem gerada por IA, um modelo genérico de aniversário, um design do Canva ou uma interpretação/reformulação do design original.\n\nOBSERVAÇÃO IMPORTANTE\n\nAo criar o design em nível profissional, não produza saturação excessiva, principalmente no fundo. Mantenha as cores do cenário controladas, profundas, naturais e cinematográficas, com predominância de tons bordô/vermelho escuro e uma aparência sofisticada."},

var CHIPS = ["Cinematográfico", "Casal", "Triste", "Pôr do sol", "Capa", "Preto e branco"];
var state = { type: "todos", q: "" };
var list = document.getElementById("list");
var toastEl = document.getElementById("toast");
var toastTimer;

function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
}

function render() {
  var q = norm(state.q.trim());
  var shown = ITEMS.filter(function (it) {
    if (state.type !== "todos" && it.type !== state.type) return false;
    if (!q) return true;
    return norm(it.title + " " + it.tags.join(" ") + " " + it.prompt).indexOf(q) !== -1;
  });
  document.getElementById("count").textContent = shown.length + (shown.length === 1 ? " prompt encontrado" : " prompts encontrados");
  if (!shown.length) {
    list.innerHTML = '<div class="empty"><strong>Nenhum prompt com esse tema</strong>Tente outra palavra ou toque em um dos temas acima.</div>';
    return;
  }
  list.innerHTML = shown.map(function (it) {
    var idx = ITEMS.indexOf(it);
    return '<article class="card" data-i="' + idx + '">' +
      '<div class="cover' + (it.img ? ' has-img' : '') + '" style="background:linear-gradient(135deg,' + it.grad[0] + ',' + it.grad[1] + ')' + (it.img ? ';aspect-ratio:' + it.ratio.replace(':', ' / ') : '') + '">' +
        (it.img ? '<img src="' + it.img + '" alt="' + esc(it.title) + '" loading="lazy">' : '') +
        '<span class="badge">' + (it.type === "video" ? "Vídeo" : "Foto") + '</span><span class="ratio">' + it.ratio + '</span></div>' +
      '<div class="body"><h2>' + esc(it.title) + '</h2>' +
      '<div class="tags">' + it.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' +
      '<p class="prompt" id="p' + idx + '">' + esc(it.prompt) + '</p>' +
      '<div class="actions"><button class="act" type="button" data-act="toggle" aria-expanded="false" aria-controls="p' + idx + '">Ver o prompt completo</button>' +
      '<button class="act primary" type="button" data-act="copy">Copiar prompt</button></div></div></article>';
  }).join("");
}

list.addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-act]");
  if (!btn) return;
  var card = btn.closest(".card");
  var it = ITEMS[Number(card.dataset.i)];
  if (btn.dataset.act === "toggle") {
    var open = card.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "Recolher prompt" : "Ver o prompt completo";
  } else {
    var ok = function () { toast("Prompt copiado"); };
    var fallback = function () {
      var p = card.querySelector(".prompt");
      card.classList.add("open");
      var r = document.createRange(); r.selectNodeContents(p);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("Texto selecionado. Use Copiar do seu telefone.");
    };
    try { navigator.clipboard.writeText(it.prompt).then(ok, fallback); } catch (err) { fallback(); }
  }
});

document.getElementById("chips").innerHTML = CHIPS.map(function (c) { return '<button class="chip" type="button">' + c + '</button>'; }).join("");
document.getElementById("chips").addEventListener("click", function (e) {
  var b = e.target.closest(".chip"); if (!b) return;
  state.q = b.textContent; document.getElementById("q").value = state.q; render();
});
document.getElementById("searchForm").addEventListener("submit", function (e) {
  e.preventDefault(); state.q = document.getElementById("q").value; render();
});
document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
document.querySelectorAll(".tab").forEach(function (t) {
  t.addEventListener("click", function () {
    state.type = t.dataset.type;
    document.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-pressed", String(x === t)); });
    render();
  });
});
render();
</script>
